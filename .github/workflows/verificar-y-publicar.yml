name: Verificar y publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install python-docx openpyxl lxml pymupdf
      - name: Simulación popperiana sobre el corpus
        run: |
          python scripts/simular.py --salida simulacion.md
          media=$(grep -oP 'Media de similitud: \*\*\K[0-9.]+' simulacion.md)
          echo "Similitud media: $media"
          if grep -q "NO APTO" simulacion.md; then echo "::error::Hay R1 NO APTAS en la simulación"; exit 1; fi
          python -c "import sys; sys.exit(0 if float('$media') >= 0.98 else 1)" || { echo "::error::La similitud media bajó de 0,98"; exit 1; }
      - name: Verificador sobre las pruebas versionadas
        run: python scripts/r1.py verificar pruebas/*/R1*.docx
      - uses: actions/upload-artifact@v4
        with:
          name: simulacion
          path: simulacion.md

  publicar:
    # Publica en Releases la versión que encabeza CHANGELOG.md si aún no existe su etiqueta.
    needs: verificar
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versión y notas desde CHANGELOG.md
        id: v
        run: |
          v=$(grep -m1 -oP '^## \Kv[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          awk -v v="## ${v}" 'index($0, v)==1 {p=1; print; next} /^## v/ {p=0} p' CHANGELOG.md > notas.md
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "existe=si" >> "$GITHUB_OUTPUT"; else echo "existe=no" >> "$GITHUB_OUTPUT"; fi
          cat notas.md
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.existe == 'no' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.version }}
          body_path: notas.md
